candidate_task: Encodes single initialization and pinned lifetime in a safe API with
  a teardown model.
inputs:
- 'C baseline scenario: publish target pointer, allow concurrent user, unregister
  producer, then release storage. No implicit quiescence guarantee.'
- 'Schedule: user reads target; remover unregisters and frees target; delayed user
  accesses target.'
- External contract is supplied only as synthetic audit evidence; candidate must state
  the dependency.
required_outputs:
- Rust wrapper or design artifact with explicit safety preconditions
- Behavior-linked evidence, scope and exclusions
- Teardown state machine and adversarial traces
- A/B/C/D findings with independent epistemic and strength fields
measurement: Distinguish compiler lifetime from API initialization restriction and
  external allocator contract.
