  invariant_refs:
  - C01
  strengths: []
  hard_gate_refs:
  - dma_ownership
- id: OR-RCU-PROOF
  input: Compile-fail lifetime example under sound-API assumptions.
  expected_condition: Record strength PROOF; never infer universal race freedom.
  failure_condition: Strength is missing, conflated or promoted to universal proof.
  predicate: strength
  invariant_refs:
  - A01
  strengths:
  - PROOF
  hard_gate_refs: []
- id: OR-RCU-OBSERVATION
  input: KCSAN reports no race in tested schedules.
  expected_condition: Record strength OBSERVATION; never infer universal race freedom.
  failure_condition: Strength is missing, conflated or promoted to universal proof.
  predicate: strength
  invariant_refs: []
  strengths:
  - OBSERVATION
  hard_gate_refs: []
- id: OR-RCU-COVERAGE
  input: 1000000 generated schedules; not all possible executions.
  expected_condition: Record strength COVERAGE; never infer universal race freedom.
  failure_condition: Strength is missing, conflated or promoted to universal proof.
  predicate: strength
  invariant_refs: []
  strengths:
