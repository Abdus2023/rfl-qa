record_type: oracle
id: OR-RCU
competency_id: C034
description: Assessor oracle over declared evidence; NOT universal formal verification.
hard_gate_coverage:
- callback_after_free
- double_free
- uaf
- data_race
- deadlock
- prohibited_sleep
- ffi_lifetime
- critical_external_assumption
- required_abi_break
- dma_ownership
checks:
- id: OR-RCU-callback_after_free
  input: '002-rcu: trace, safety audit and applicability statement for callback_after_free'
  expected_condition: callback_possible implies target alive
  failure_condition: 'Observed or logically demonstrated violation of: callback_possible
    implies target alive'
  predicate: safety
  invariant_refs:
  - C01
  strengths: []
  hard_gate_refs:
  - callback_after_free
- id: OR-RCU-double_free
  input: '002-rcu: trace, safety audit and applicability statement for double_free'
