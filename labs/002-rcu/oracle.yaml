  hard_gate_refs: []
- id: OR-RCU-ABSENCE_OF_EVIDENCE
  input: NMI not exercised and excluded from scope.
  expected_condition: Record strength ABSENCE_OF_EVIDENCE; never infer universal race
    freedom.
  failure_condition: Strength is missing, conflated or promoted to universal proof.
  predicate: strength
  invariant_refs: []
  strengths:
  - ABSENCE_OF_EVIDENCE
  hard_gate_refs: []
teardown_model:
- CREATE
- REGISTER
- ACTIVE
- STOP
- QUIESCE
- CALLBACK DRAIN
- REFERENCE DRAIN
- DESTROY
- FREE
safety_predicates:
- alive(reference) => object_alive
- callback_possible => callback_target_alive
- free(object) => no live reference AND no callback possible AND no RCU reader AND
  no registered owner
