evidence_binding_schema:   # every future execution result MUST bind these identities (frozen requirement)
  command: required
  command_digest: required
  environment_digest: required
  input_digest: required
  output_digest: required
  artifact_digest: required
  result: required
  rule: >
    Assessor-entered PASS strings are never sufficient execution evidence; each stage result must
    bind source, environment, command, configuration, artifacts, and result identities with digests.

negative_fixture_plan:   # oracle-sensitivity checks (frozen section 14 of the phase protocol)
  purpose: verify oracle sensitivity with known-failure fixtures before any positive claims are relied upon
  planned_fixtures:
    - {kind: intentional_uaf, lab: 001-pin-init, expected_oracle: OR-PIN-uaf BLOCKED, status: NOT_RUN}
    - {kind: intentional_data_race, lab: 002-rcu, expected_oracle: OR-RCU-data_race BLOCKED, status: NOT_RUN}
    - {kind: intentional_callback_after_free, lab: 003-callback-teardown, expected_oracle: OR-CALLBACK-callback_after_free BLOCKED, status: NOT_RUN}
    - {kind: intentional_prohibited_sleep, lab: 003-callback-teardown, expected_oracle: OR-CALLBACK-prohibited_sleep BLOCKED, status: NOT_RUN}
    - {kind: intentional_lifetime_violation, lab: 001-pin-init, expected_oracle: OR-PIN-ffi_lifetime BLOCKED, status: NOT_RUN}
  recording_rule: >
    Where the experimental design supports it, record true_positive / false_negative per fixture.
    Detector sensitivity must never be generalized from a single synthetic case.
  status: NOT_RUN

global_limitations:
  - Synthetic fixtures and dossiers are NOT equivalent to real kernel execution and were never counted as such.
  - No kernel, compiler, or sanitizer execution occurred in this phase; every execution field is NOT_RUN.
  - 'PASS' states recorded anywhere in the frozen alpha fixtures are synthetic oracle expectations over supplied evidence, not hardware observations.
