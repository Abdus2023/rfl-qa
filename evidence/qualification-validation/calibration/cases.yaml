  - id: CS-004
    class: negative
    competency_id: C034
    task: >
      Assess the candidate artifact against C034. The candidate's own trace accepts a reader racing
      with removal.
    evidence_package:
      - inline_fragment: |
          candidate trace (synthetic): reader traverses list while remover unlinks and frees;
          candidate writes: "free is fine here; readers hold no reference that matters after unlink."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-RCU]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L0
      claimed_level: L1
      failed: [CB-034-01]
      hard_gates: UAF_VETO_BLOCKED
      decision: REJECTED
      rationale: >
        CB-034-01 FAILED (reader-racing-removal not identified) and the trace demonstrates an
        access-after-free hazard: hard-gate veto wins regardless of level claims. No level supported.
  - id: CS-005
    class: boundary
    competency_id: C047
    task: >
      Assess near the L2/L3 boundary: wrapper and registration owner recorded (L2); teardown state
      machine covers unregister/callback ordering but omits reference and free ordering.
    evidence_package:
      - inline_fragment: |
          // wrapper.rs (synthetic): refcounted callback wrapper, owner recorded at registration
          struct Cb { kref: Kref, owner: RegOwner }
          // teardown notes (synthetic): "unregister before callbacks; drain step to be designed."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-CALLBACK]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L2
      boundary_pair: L2/L3
      demonstrated: [CB-047-01, CB-047-02]
      incomplete: [CB-047-03]
      hard_gates: PASS_within_synthetic_scope
      decision: PROVISIONAL
      rationale: Deliberately near the boundary; missing reference/free ordering blocks L3 without failing a required L2 behavior.
  - id: CS-006
    class: boundary
    competency_id: C034
    task: >
      Assess near the L3/L4 boundary: guard and remove/grace/free ordering correct; the L4 audit
      section reports "KCSAN clean over 10000 iterations, therefore ordering proven".
    evidence_package:
      - inline_fragment: |
          candidate audit (synthetic): guard prevents reference escape; remove->grace->free modeled;
          "KCSAN reported no races in 10^4 iterations; memory ordering PROVEN."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-RCU]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L3
      boundary_pair: L3/L4
      demonstrated: [CB-034-01, CB-034-02, CB-034-03]
      not_established: [CB-034-04]
      epistemic_finding: >
        CB-034-04 requires adversarial audit WITHOUT treating KCSAN as proof. A KCSAN clean run is
        OBSERVATION over bounded executions with COVERAGE limits; it is not PROOF and not ABSENCE
        evidence of all races.
      hard_gates: PASS_within_synthetic_scope
      decision: PROVISIONAL
      rationale: L4 fails its own definition (proof claim from bounded dynamic observation); L3 intact.
  - id: CS-007
    class: boundary
    competency_id: C053
    task: >
      Assess near the L4/L5 boundary: partial-initialization unwind and allocator-lifetime audit are
      complete; a subsystem initialization policy draft exists but has no independent review record.
    evidence_package:
      - inline_fragment: |
          audit (synthetic): unwind paths enumerated per field; allocator contract stated as external
          dependency D01 with x86_64 scope.
          policy draft (synthetic): "Subsystem init policy v0 — internal draft, not reviewed."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-PIN]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption, required_abi_break, dma_ownership]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L4
      boundary_pair: L4/L5
      demonstrated: [CB-053-01, CB-053-02, CB-053-03, CB-053-04]
      not_established: [CB-053-05]
      hard_gates: PASS_within_synthetic_scope
