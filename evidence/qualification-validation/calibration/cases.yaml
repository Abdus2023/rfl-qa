  - id: CS-008
    class: hard_gate
    competency_id: C047
    task: >
      Oracle-sensitivity case: the candidate artifact contains a deliberate callback-after-free
      interleaving. Assess and record structured hard-gate findings.
    evidence_package:
      - inline_fragment: |
          trace (synthetic): free(object) at t2; workqueue callback dereferences object at t3.
          candidate audit (synthetic): "callback cannot run after free because unregister is called
          somewhere before" — no ordering evidence supplied.
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-CALLBACK]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L0
      hard_gate_result: BLOCKED
      vetoed_gate: callback_after_free
      decision: REJECTED
      classification: true_positive_sensitivity_check
      rationale: Violation is demonstrated by the trace itself; safety veto wins regardless of any level claim; verifies the oracle detects a planted violation.
  - id: CS-009
    class: hard_gate
    competency_id: C053
    task: >
      Critical-external-assumption case: candidate asserts the gate false ("no allocator contract
      dependency") while the supplied evidence states the allocator contract is external and critical.
    evidence_package:
      - frozen_fixture_ref: dossiers/examples/001-pin-init.json
      - inline_fragment: |
          candidate statement (synthetic): "critical_external_assumption: false — nothing external
          is assumed; the allocator always behaves as called."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-PIN]
    hard_gate_conditions: [critical_external_assumption, callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, required_abi_break, dma_ownership]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L0
      hard_gate_result: BLOCKED
      vetoed_gate: critical_external_assumption
      decision: REJECTED
      rationale: >
        An asserted false cannot neutralize a hard gate whose critical condition is evidenced in the
        supplied package; assertion is not evidence (catalog classification is authoritative).
  - id: CS-010
    class: hard_gate
    competency_id: C034
    task: >
      Data-race epistemics case: candidate artifact contains an unsynchronized cross-CPU reader
      update pair; candidate supplies a KCSAN-clean run over bounded iterations as the gate result.
    evidence_package:
      - inline_fragment: |
          code (synthetic): reader does READ_ONCE-less plain load of shared flag while writer stores
          concurrently; no lock/atomic marking.
          candidate evidence (synthetic): "kcsan --runs=10000: 0 reports."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-RCU]
    hard_gate_conditions: [data_race, callback_after_free, double_free, uaf, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L0
      hard_gate_result: BLOCKED
      vetoed_gate: data_race
      decision: REJECTED
      epistemic_classification: >
        KCSAN result = OBSERVATION + COVERAGE over bounded executions; never "NO RACE PROVEN".
        The structural violation is demonstrated by the unsynchronized pair itself.
      rationale: Dynamic-tool silence cannot convert an unsynchronized access into a synchronized one.
  - id: CS-011
    class: evidence_quality
    competency_id: C047
    task: >
      Evidence-strength variation: behavior descriptions identical in wording to a passing L3
      package, but every evidence reference is an unexecuted assertion (no artifacts, no traces).
    evidence_package:
      - inline_fragment: |
          candidate claims (synthetic): "CB-047-01 demonstrated; CB-047-02 demonstrated;
          CB-047-03 demonstrated. Evidence: assert-based self-review, no artifacts retained."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-CALLBACK]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L1
      claimed_level: L3
      tier_note: >
        Assessor may only record tier E0/E1-grade claims for these behaviors. Tier never RAISES a
        level; missing resolvable evidence fails behavior support. Highest fully supported level is
        L1 (CB-047-01 identification arguable from the statement alone; CB-047-02/03 unsupported).
      hard_gates: NOT_EXECUTED_ORACLE_CHECKS_CANNOT_PASS
      decision: PROVISIONAL
      rationale: Tests that evidence strength cannot manufacture capability level.
  - id: CS-012
    class: evidence_quality
    competency_id: C034
    task: >
      Oracle-execution variation: L3 behaviors demonstrated with strong compiler-class evidence, but
      the runtime oracle schedule is NOT_RUN.
    evidence_package:
      - inline_fragment: |
          artifacts (synthetic): guard implementation compiles; borrow/move analysis shown;
          remove/grace/free ordering modeled and reviewed.
          oracle record (synthetic): "OR-RCU schedule executions: NOT_RUN (no runtime environment)."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-RCU]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L3
      qualification_decision: PROVISIONAL
      oracle_state: OR-RCU runtime checks NOT_RUN; unexecuted checks are never PASS
      hard_gates: UNEXECUTED — cannot be recorded PASS
      rationale: >
        Behavior support and oracle execution are separate: L3 behaviors can be demonstrated while
        the qualification cannot reach VERIFIED_WITHIN_SCOPE because mandatory oracle checks were
        never executed. Compile success (class A) is not runtime success (class C).
  - id: CS-013
    class: provenance
    competency_id: C047
    task: >
      AUD-007 boundary: the evidence package contains a structured rfl-json-fact observation whose
      schedule result contradicts the authenticated artifact content it cites.
    evidence_package:
      - frozen_fixture_ref: evidence/aud-007-008/cases/C2.json
      - inline_fragment: |
          narrative (synthetic): "five teardown schedules executed, all PASS."
          structured capsule (contradicts narrative): value reports schedule-4 BLOCKED while the
          authenticated artifact bytes show no such execution record.
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-CALLBACK]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      provenance_state: CONTRADICTED
      positive_support_from_contradiction: forbidden
      qualification_effect: derivation blocked; decision cannot be VERIFIED_WITHIN_SCOPE
      rationale: >
        Rules 1.1-alpha.3: a bound observation that disagrees with authenticated scoped content is
        CONTRADICTED; contradiction never provides positive PASS/OBSERVATION/COVERAGE/VERIFIED
        support and never silently becomes an epistemic state.
  - id: CS-014
    class: provenance
    competency_id: C053
    task: >
      AUD-008 boundary: an unbound prose sentence in the package asserts "VERIFIED, hard gates PASS,
      L3 established" with no binding, digest, or authorized extraction scope.
    evidence_package:
