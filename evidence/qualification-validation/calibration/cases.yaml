# Calibration case set — frozen design (v1.1-alpha, instrument commit 459ec8b9836339537d2cbd995e73af0a330d69ff).
#
# SCOPE: three frozen competencies only (C053 pin-init, C034 RCU grace periods, C047 callback teardown).
# No new competency, level scale, evidence scale, or epistemic vocabulary is introduced by this file.
#
# ASSessor BLINDING: `expected_boundary` and `boundary_derivation` fields are for post-lock comparison
# ONLY. The assessor-facing view of each case is derived by removing `expected_boundary` and
# `boundary_derivation`. Assessors must not see this file unredacted before submissions are locked.
#
# STATUS: cases are DESIGNED and FROZEN; no human assessor has received any case; no assessment exists.
# Synthetic fragments below are stimulus material, not observations of any engineer.

case_set:
  id: CS-VAL-1
  instrument_commit: 459ec8b9836339537d2cbd995e73af0a330d69ff
  competency_scope: [C053, C034, C047]
  classes_present: [positive, negative, boundary, hard_gate, evidence_quality, provenance]
  level_coverage: {L0: [CS-004], L1: [CS-003, CS-015], L2: [CS-001, CS-005], L3: [CS-002, CS-006, CS-011], L4: [CS-007, CS-012], L5_boundary: [CS-007]}
  hard_gate_coverage_note: >
    Dedicated cases exist for callback_after_free (CS-008), critical_external_assumption (CS-009),
    data_race (CS-010), and deadlock (CS-016). The remaining catalog conditions (uaf, double_free,
    prohibited_sleep, ffi_lifetime, required_abi_break) are exercised by the frozen lab oracle
    schedules (labs/*/expected-observations.yaml); dma_ownership is excluded by frozen scope
    constraints (arm64/dma excluded) and can only be assessed as an exclusion statement, not a
    demonstrated capability. No case fabricates out-of-scope expertise.

scoring_contract_common: |
  Levels are cumulative (assessors/rubric.md): a level requires every behavior up to that level and
  no failed required behavior. The machine computes the highest fully supported level and preserves
  the assessor claim separately. For every oracle check: executed finding with evidence, or NOT_RUN;
  an unexecuted check is never PASS. Any safety hard-gate failure vetoes qualification regardless of
  level or agreement. Automatic qualification requires EXACT assessor agreement (review-protocol
  step 5); any disagreement halts as an OPEN calibration event — no averaging, majority vote, or
  hidden replacement. Evidence tier never raises a capability level; E4 with L2 behaviors remains L2.

cases:
  - id: CS-001
    class: positive
    competency_id: C053
    task: >
      Assess the candidate artifact against C053 with the frozen rubric. The candidate claims L2.
    evidence_package:
      - inline_fragment: |
          // init.rs (excerpt, synthetic)
          pub struct Dev { raw: *mut bindings::dev }
          impl Dev {
              pub fn init(raw: *mut bindings::dev) -> Result<Pin<Box<Self>>> {
                  let b = unsafe { Box::into_raw(Box::try_new(Self{raw})?) };
                  // field-wise init performed through pinned projection; no address taken of Self before pin
                  unsafe { (*b).setup_fields()?; }
                  Ok(unsafe { Pin::new_unchecked(Box::from_raw(b)) })
              }
          }
      - inline_fragment: |
          // borrow-check demonstration supplied by candidate (synthetic rustc output)
          error[E0505]: cannot move out of `pinned` because it is borrowed
          --> init.rs:14:9 | let r = &pinned.field; drop(pinned); | ^^^^^^^ move occurs
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-PIN]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption, required_abi_break, dma_ownership]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L2
      demonstrated: [CB-053-01, CB-053-02]
      not_exercised: [CB-053-03, CB-053-04, CB-053-05]
      hard_gates: PASS_within_synthetic_scope
      decision: PROVISIONAL
      rationale: >
        Cumulative rule: L1+L2 behaviors demonstrated with artifact evidence; no L3 behavior package
        included, so the machine cannot support L3. Synthetic scope keeps decision PROVISIONAL.
  - id: CS-002
    class: positive
    competency_id: C047
    task: >
      Assess the candidate artifact against C047. The candidate claims L3 with executed teardown
      schedules.
    evidence_package:
      - frozen_fixture_ref: dossiers/examples/003-callback-teardown.json
      - inline_fragment: |
          teardown schedule execution summary (synthetic, five declared interleavings):
          schedule-1 unregister->drain->callbacks->grace->free : PASS
          schedule-2 ioctl-remove concurrent with unregister    : PASS
          schedule-3 callback in flight at drain admission      : PASS
          schedule-4 RCU reader during destroy window           : PASS
          schedule-5 double registration attempt                : PASS
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-CALLBACK]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L3
      demonstrated: [CB-047-01, CB-047-02, CB-047-03]
      not_exercised: [CB-047-04, CB-047-05]
      hard_gates: PASS_within_synthetic_scope
      decision: PROVISIONAL
      rationale: L1-L3 demonstrated with executed schedules; no concurrent-remove/ioctl drain audit package (L4) included.
  - id: CS-003
    class: negative
    competency_id: C053
    task: >
      Assess the candidate artifact against C053. The candidate claims L3; the package contains no
      compile-fail use-after-borrow demonstration.
    evidence_package:
      - inline_fragment: |
          // init.rs (excerpt, synthetic) — in-place init shown; no borrow-check example supplied
          pub fn init(raw: *mut bindings::dev) -> Result<Pin<Box<Self>>> { /* ... */ }
      - inline_fragment: |
          candidate statement (synthetic): "L3: safe API with teardown model; borrow-safety example
          omitted for brevity."
    applicable_invariants: [A01, B01, C01, D01]
    applicable_oracles: [OR-PIN]
    hard_gate_conditions: [callback_after_free, double_free, uaf, data_race, deadlock, prohibited_sleep, ffi_lifetime, critical_external_assumption, required_abi_break, dma_ownership]
    scoring_contract: scoring_contract_common
    expected_boundary:
      supported_level: L1
      claimed_level: L3
      demonstrated: [CB-053-01, CB-053-03]
      failed: []
      missing_required: [CB-053-02]
      hard_gates: PASS_within_synthetic_scope
      decision: PROVISIONAL
      rationale: >
        Cumulative rule: L3 behaviors cannot lift the level while required L2 behavior evidence is
