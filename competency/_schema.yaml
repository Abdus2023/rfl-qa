$schema: https://json-schema.org/draft/2020-12/schema
$id: https://rfl-qa.dev/schemas/competency
type: object
properties:
  record_type:
    const: competency
  id:
    type: string
    enum:
    - C047
    - C053
    - C034
  domain:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  behavior_matrix:
    type: object
    properties:
      L1:
        type: array
        items: &id001
          type: object
          properties:
            id:
              type: string
              minLength: 1
              pattern: ^CB-\d{3}-\d{2}$
            description:
              type: string
              minLength: 1
          required:
          - id
          - description
          additionalProperties: false
        minItems: 1
        uniqueItems: true
      L2:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
      L3:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
      L4:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
      L5:
        type: array
        items: *id001
        minItems: 1
        uniqueItems: true
    required:
    - L1
    - L2
    - L3
    - L4
    - L5
    additionalProperties: false
  required_evidence:
    type: object
    properties:
      behavior_evidence_required:
        const: true
      invariant_refs:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        uniqueItems: true
      oracle_refs:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        uniqueItems: true
    required:
    - behavior_evidence_required
    - invariant_refs
    - oracle_refs
    additionalProperties: false
  hard_gate_conditions:
    type: array
    items:
      type: string
      enum:
      - callback_after_free
      - double_free
      - uaf
      - data_race
      - deadlock
      - prohibited_sleep
      - ffi_lifetime
      - critical_external_assumption
      - required_abi_break
      - dma_ownership
    minItems: 10
    uniqueItems: true
    maxItems: 10
  scope_constraints:
    type: object
    properties:
      task_classes:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        uniqueItems: true
      environments:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        uniqueItems: true
      exclusions:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 0
        uniqueItems: true
    required:
    - task_classes
    - environments
    - exclusions
    additionalProperties: false
required:
- record_type
- id
- domain
- title
- description
- behavior_matrix
- required_evidence
- hard_gate_conditions
- scope_constraints
additionalProperties: false
